name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libx11-dev curl python3
      - name: Set up Odin
        run: ./scripts/bootstrap.sh
      - name: Test
        run: ./scripts/test.sh
      - name: Build and package Linux
        run: |
          ./scripts/build.sh
          ./scripts/package.sh --use-built
      - name: Set up web tools
        run: ./scripts/bootstrap-web.sh
      - name: Build and package web
        run: |
          ./scripts/build-web.sh
          ./scripts/package-web.sh --use-built
      - name: Upload downloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: game-builds
          path: |
            build/the-princess-has-my-toad-linux-x86_64.tar.gz
            build/the-princess-has-my-toad-linux-x86_64.tar.gz.sha256
            build/the-princess-has-my-toad-web.zip
            build/the-princess-has-my-toad-web.zip.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Assemble Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p build/pages
          python3 -m zipfile -e build/the-princess-has-my-toad-web.zip build/pages
          cp build/the-princess-has-my-toad-linux-x86_64.tar.gz build/the-princess-has-my-toad-linux-x86_64.tar.gz.sha256 build/pages/
      - name: Upload Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
