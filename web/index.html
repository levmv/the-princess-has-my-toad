<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111816">
<link rel="icon" href="data:,">
<title>The Princess Has My Toad</title>
<link rel="stylesheet" href="style.css?v=__BUILD_ID__">
</head>
<body>
<main id="stage">
  <canvas id="canvas" width="1280" height="800" tabindex="0" aria-label="The Princess Has My Toad game"></canvas>
  <section id="cover" data-state="loading">
    <header class="cover-header">
      <div class="languages"><button id="ru" aria-pressed="true">РУС</button><button id="en" aria-pressed="false">ENG</button></div>
    </header>
    <h1><img src="logo.png?v=__BUILD_ID__" width="1984" height="793" alt="The Princess Has My Toad"></h1>
    <div class="cover-actions">
      <p id="status" class="sr-only" role="status">Устанавливаем связь…</p>
      <button id="start" disabled>Начать</button>
      <p id="requirements">Клавиатура и мышь · WebGL 2</p>
    </div>
    <div class="boot-panel">
      <div class="boot-heading"><span>SIGNAL / 640 KB</span><span class="signal-led"></span></div>
      <div class="boot-readout"><span id="boot-phase">Принимаем сигнал</span><span id="boot-number" aria-hidden="true">000%</span></div>
      <div id="boot-meter" role="progressbar" aria-label="Связь с башней" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
      <p id="boot-detail"></p>
    </div>
    <div class="control-hints">
      <p id="glideTip">Планер: в воздухе отпусти пробел, нажми снова и удерживай.</p>
      <p id="kickTip">F — пинок.</p>
    </div>
  </section>
  <button id="capture" hidden>Нажми, чтобы управлять мышью</button>
</main>
<footer><span id="keys">WASD — движение · мышь — взгляд · Esc — пауза</span><button id="fullscreen">Полный экран</button></footer>
<script src="odin.js?v=__BUILD_ID__"></script>
<script src="app.js?v=__BUILD_ID__"></script>
<script id="game-runtime" async src="game.js?v=__BUILD_ID__"></script>
</body>
</html>
